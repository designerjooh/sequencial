<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container"> 
        <h1>Calculadora Soma</h1>
        <input type="number" id="numero1" placeholder="Digite o primeiro número">
        <input type="number" id="numero2" placeholder="Digite o segundo número">

        <button onclick="somar()">Calcular Soma</button>

        <h2 id="resultado1"> Resultado: </h2>
    </section>

    <section class="container">
        <h1>Converter Celsius para Fahrenheit</h1>

        <input type="number" id="celsius" placeholder="Digite a temperatura">
        
        <button onclick="converter()">Converter</button>

        <h2 id="resultado2"> Resultado</h2>

    </section>

    <!--  Exercicios 1 -->

    <section class="container">
    <h1>Calculadora de volume</h1>

    <input type="number" id="raio" placeholder="Digite o Raio">
    <input type="number" id="altura" placeholder="Digite a Altura">

    <button onclick="Cvolume()">Calcular</button>

    <h2 id="resultado3"> Resultado</h2>
    </section>

    <!-- Exercicio 2 -->

    <section class="container">
    <h1>Calculadora de volume de uma caixa retangular</h1>

    <input type="number" id="comprimento" placeholder="Digite o Comprimento">
    <input type="number" id="largura" placeholder="Digite a Largura">
    <input type="number" id="alto" placeholder="Digite a Altura">

    <button onclick="vol()">Calcular</button>

    <h2 id="resultado4"> Resultado</h2>
    </section>

    <script src="script.js/script.js"></script>
</body>
</html>
